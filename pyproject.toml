[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ongoingrec"
version = "0.1.0"
description = "PW OngoingRec - background microphone recording service with timestamped segment retrieval"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "scipy>=1.12"]

[project.scripts]
ongoingrec = "ongoingrec.__main__:main"

[tool.setuptools.packages.find]
include = ["ongoingrec*", "mockbackend*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
