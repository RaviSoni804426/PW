# The recording agent: a Windows service that runs on a counsellor's laptop.
#
# Deliberately separate from ../backend: sounddevice and numpy exist to open a
# microphone, and nothing in the container that receives clips needs them.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ongoingrec"
version = "0.1.0"
description = "PW OngoingRec agent - background microphone recording with timestamped segment retrieval"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
# tests/test_transport.py drives the real poller against the reference backend,
# so the dev environment needs ../backend installed as well:
#   pip install -e "./agent[dev]" -e "./backend[dev]"
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "scipy>=1.12"]

[project.scripts]
ongoingrec = "ongoingrec.__main__:main"

[tool.setuptools.packages.find]
include = ["ongoingrec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
