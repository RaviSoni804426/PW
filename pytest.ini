# Both suites from the repository root: `pytest -q`.
# Each side also runs on its own, from inside agent/ or backend/.
#
# importlib mode because there are now two directories called `tests`; the
# default prepend mode imports the first as the package `tests` and then cannot
# see the second at all.
[pytest]
testpaths = agent/tests backend/tests
addopts = --import-mode=importlib
filterwarnings = ignore::DeprecationWarning
